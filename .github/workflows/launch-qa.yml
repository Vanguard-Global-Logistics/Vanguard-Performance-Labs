name: Vanguard Launch QA

on:
  pull_request:
    branches: [main, rebuild/vpl-launch]
  push:
    branches: [main, rebuild/vpl-launch]

permissions:
  contents: read

concurrency:
  group: launch-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run launch browser tests
        run: npm run test

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-launch-report
          path: |
            test-results/report
            test-results/visual
          if-no-files-found: ignore
          retention-days: 7
