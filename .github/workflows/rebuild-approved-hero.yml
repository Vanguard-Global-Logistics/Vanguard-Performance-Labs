name: Rebuild approved hero binary

on:
  push:
    branches: [rebuild/vpl-launch]
    paths:
      - ".github/workflows/rebuild-approved-hero.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/vpl-launch
          fetch-depth: 0

      - name: Rebuild and verify approved hero
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/hero/*.b64 | base64 --decode > public/images/approved/hero-winged-vial.webp
          test "$(stat -c %s public/images/approved/hero-winged-vial.webp)" = "10730"
          test "$(git hash-object public/images/approved/hero-winged-vial.webp)" = "33fd34c8b4660938da37488d064d242fabe2e9f2"

      - name: Commit exact binary and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging/hero
          rm -f .github/workflows/rebuild-approved-hero.yml
          git config user.name "Vanguard Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/approved/hero-winged-vial.webp .asset-staging .github/workflows/rebuild-approved-hero.yml
          git commit -m "fix(home): restore verified approved hero binary"
          git push origin HEAD:rebuild/vpl-launch
